name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        id: release
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/WorldTVGuide-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/WorldTVGuide.apk
          else
            cp out/WorldTVGuide-debug.apk out/WorldTVGuide.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WorldTVGuide-apk
          path: out/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WorldTV Guide build ${{ github.run_number }}
          body: |
            Download **WorldTVGuide.apk** below and open it on your Android phone (Android 8.0+).
            You may need to allow "Install unknown apps" for your browser or file manager.
          files: out/*.apk
